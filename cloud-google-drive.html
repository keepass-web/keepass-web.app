<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KeePass Web — Google Drive</title>
  <style>
/* ============================================================
   Reset and design tokens (shared palette with the 0x67 app)
   ============================================================ */

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface-2: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #58a6ff;
  --accent-dim: #1f3358;
  --danger: #f85149;
  --success: #3fb950;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.wordmark {
  font-weight: 700;
  letter-spacing: 0.02em;
  color: var(--accent);
}

/* #root is a flex-shrink:0 sibling away from footer below, so it grows to
   fill whatever space footer doesn't need — see .screen-host, which used to
   claim a flat 100vh of its own and is now sized off this instead. */
#root {
  flex: 1;
  min-height: 0;
}

.sponsor-cta {
  flex-shrink: 0;
  padding: 0.4rem 1rem 0;
  font-size: 0.85rem;
  color: var(--text);
  text-align: center;
}

footer {
  flex-shrink: 0;
  padding: 0.4rem 1rem;
  border-top: 1px solid var(--border);
  font-size: 0.8rem;
  color: var(--muted);
  text-align: center;
}

footer a {
  color: var(--accent);
}

.sponsor-cta a {
  color: var(--accent);
  font-weight: 600;
}

/* ============================================================
   Buttons and shared bits
   ============================================================ */

.btn {
  display: inline-block;
  padding: 0.55rem 1.1rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  font: inherit;
  cursor: pointer;
  background: var(--surface-2);
  color: var(--text);
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #04101f;
  font-weight: 600;
}

.btn-secondary {
  background: var(--surface-2);
}

.btn:hover {
  filter: brightness(1.08);
}

.back-link {
  display: inline-block;
  background: none;
  border: none;
  color: var(--muted);
  font: inherit;
  cursor: pointer;
  text-decoration: none;
}

.back-link:hover {
  color: var(--text);
}

.error-msg {
  color: var(--danger);
  font-size: 0.9rem;
}

/* ============================================================
   Screen: Sign in
   ============================================================ */

.screen-signin {
  max-width: 460px;
  margin: 12vh auto 0;
  padding: 0 1.5rem;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 1rem;
  text-align: left;
}

.screen-signin h1 {
  font-size: 1.6rem;
}

.description {
  color: var(--muted);
}

/* ============================================================
   Screen: Choose a file (Google Picker)
   ============================================================ */

.screen-picker {
  max-width: 720px;
  margin: 0 auto;
  padding: 1.5rem;
}

.picker-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 2rem;
}

.picker-body {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 1rem;
  max-width: 460px;
  margin: 6vh auto 0;
}

.pick-status {
  color: var(--muted);
  font-size: 0.9rem;
}

/* ============================================================
   Screen: Embedded app
   ============================================================ */

.screen-host {
  display: flex;
  flex-direction: column;
  height: 100%;
}

.host-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.6rem 1rem;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.host-filename {
  color: var(--muted);
  font-size: 0.9rem;
}

.app-frame {
  flex: 1;
  width: 100%;
  border: none;
}

</style>
</head>
<body>
  <!-- Live screen container -->
  <div id="root"></div>

  <!-- ============================================================
       Screen: Sign in
       ============================================================ -->
  <template id="tpl-signin">
    <div class="screen screen-signin">
      <div class="wordmark">KeePass Web</div>
      <h1>Open from Google Drive</h1>
      <p class="description">
        Open and save a KeePass database that lives in your own Google Drive —
        the file's bytes go straight into this browser tab, never onto disk.
        You sign in with Google; KeePass Web stores nothing.
      </p>
      <button type="button" class="btn btn-primary" data-action="signin">Sign in with Google</button>
      <p id="signin-error" class="error-msg" hidden></p>
      <a class="back-link" href="index.html">← Back to KeePass Web</a>
    </div>
  </template>

  <!-- ============================================================
       Screen: Choose a file (Google Picker)
       ============================================================ -->
  <template id="tpl-picker">
    <div class="screen screen-picker">
      <header class="picker-header">
        <span class="wordmark">Google Drive</span>
        <button type="button" class="btn btn-secondary" data-action="signout">Sign out</button>
      </header>
      <div class="picker-body">
        <p class="description">Choose a KeePass database from your Google Drive to open.</p>
        <button type="button" class="btn btn-primary" data-action="pick">Choose a database…</button>
        <p id="pick-status" class="pick-status" hidden></p>
      </div>
    </div>
  </template>

  <!-- ============================================================
       Screen: Embedded 0x67 app
       ============================================================ -->
  <template id="tpl-host">
    <div class="screen screen-host">
      <header class="host-header">
        <button type="button" class="back-link" data-action="back-to-drive">← Drive</button>
        <span id="host-filename" class="host-filename"></span>
      </header>
      <iframe id="app-frame" class="app-frame" title="KeePass Web app"></iframe>
    </div>
  </template>

  <p class="sponsor-cta">
    Like KeePass Web? <a href="https://github.com/sponsors/keepass-web" target="_blank" rel="noopener noreferrer">&hearts; Sponsor</a> its development.
  </p>

 *
