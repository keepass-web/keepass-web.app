  <style>
/* ============================================================
   Reset and design tokens (shared palette with the 0x67 app)
   ============================================================ */

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* Elements with an explicit `display` (e.g. .btn's `display: inline-flex`)
 * otherwise win the cascade over the UA stylesheet's `[hidden] { display:
 * none }`, since both are same-specificity author-vs-UA rules and author
 * always wins — so JS toggling `el.hidden` silently stops hiding anything
 * once a class gives that element its own `display`. Force it back. */
[hidden] {
  /* biome-ignore lint/complexity/noImportantStyles: this rule's entire job is to out-rank any other display declaration, by design */
  display: none !important;
}

:root {
  --bg: #eef2ef;
  --surface: #ffffff;
  --surface-2: #eaefec;
  --border: #d8e2dc;
  --text: #0e1714;
  --muted: #5a6a62;
  --accent: #0e7c5a;
  --accent-dim: #eaf1ee;
  --danger: #9a2b2b;
  --success: #0e7c5a;
}

/* `height`, not `min-height`: the embedded-app screen's `.app-frame` iframe
 * depends on `.screen-host { height: 100% }` resolving all the way up this
 * chain, and a flex container only counts as having a "definite" size for
 * that percentage-height resolution when its own size is definite — a
 * `min-height` doesn't qualify, even though it still visually fills the
 * viewport. Without this, the iframe collapses to the browser's ~150px
 * default intrinsic height. */
body {
  background: var(--bg);
  color: var(--text);
  font-family: ui-monospace, monospace;
  font-size: 15px;
  height: 100vh;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
}

.wordmark {
  display: inline-flex;
  align-items: center;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: var(--accent);
}

.mark {
  position: relative;
  width: 18px;
  height: 18px;
  margin-right: 0.5rem;
  flex-shrink: 0;
}

.mark::before {
  content: "";
  position: absolute;
  top: 0;
  left: 3px;
  width: 12px;
  height: 10px;
  border: 2.5px solid var(--accent);
  border-bottom: none;
  border-radius: 7px 7px 0 0;
}

.mark::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  width: 18px;
  height: 11px;
  background: var(--accent);
  border-radius: 3px;
}

/* #root is a flex-shrink:0 sibling away from footer below, so it grows to
   fill whatever space footer doesn't need — see .screen-host, which used to
   claim a flat 100vh of its own and is now sized off this instead. */
#root {
  flex: 1;
  min-height: 0;
}

.sponsor-cta {
  flex-shrink: 0;
  padding: 0.4rem 1rem 0;
  font-size: 0.85rem;
  color: var(--text);
  text-align: center;
}

footer {
  flex-shrink: 0;
  padding: 0.4rem 1rem;
  border-top: 1px solid var(--border);
  font-size: 0.8rem;
  color: var(--muted);
  text-align: center;
}

footer a {
  color: var(--accent);
}

.sponsor-cta a {
  color: var(--accent);
  font-weight: 600;
}

/* ============================================================
   Buttons and shared bits
   ============================================================ */

.btn {
  display: inline-block;
  padding: 0.55rem 1.1rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  font: inherit;
  cursor: pointer;
  background: var(--surface-2);
  color: var(--text);
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}

.btn-secondary {
  background: var(--surface-2);
}

.btn:hover {
  filter: brightness(1.08);
}

.back-link {
  display: inline-block;
  background: none;
  border: none;
  color: var(--muted);
  font: inherit;
  cursor: pointer;
  text-decoration: none;
}

.back-link:hover {
  color: var(--text);
}

.error-msg {
  color: var(--danger);
  font-size: 0.9rem;
}

/* ============================================================
   Screen: Sign in
   ============================================================ */

.screen-signin {
  max-width: 460px;
  margin: 12vh auto 0;
  padding: 0 1.5rem;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 1rem;
  text-align: left;
}

.screen-signin h1 {
  font-size: 1.6rem;
}

.description {
  color: var(--muted);
}

/* ============================================================
   Screen: Choose a file (Google Picker)
   ============================================================ */

.screen-picker {
  max-width: 720px;
  margin: 0 auto;
  padding: 1.5rem;
}

.picker-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 2rem;
}

.picker-body {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 1rem;
  max-width: 460px;
  margin: 6vh auto 0;
}

.pick-status {
  color: var(--muted);
  font-size: 0.9rem;
}

/* ============================================================
   Screen: Embedded app
   ============================================================ */

.screen-host {
  display: flex;
  flex-direction: column;
  height: 100%;
}

.host-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.6rem 1rem;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.host-filename {
  color: var(--muted);
  font-size: 0.9rem;
}

.app-frame {
  flex: 1;
  width: 100%;
  border: none;
}

</style>

    });
    pickerApiLoaded = true;
}
function openPicker() {
    const picker = new google.picker.PickerBuilder()
        .setAppId(APP_ID)
        .setOAuthToken(must(accessToken))
        .setDeveloperKey(DEVELOPER_KEY)
        .addView(google.picker.ViewId.DOCS)
        .setCallback(handlePickerResult)
        .build();
    picker.setVisible(true);
}
function handlePickerResult(data) {
    if (data[google.picker.Response.ACTION] !== google.picker.Action.PICKED)
        return;
    const docs = data[google.picker.Response.DOCUMENTS];
    const doc = must(docs[0]);
    const file = {
        id: String(doc[google.picker.Document.ID]),
        name: String(doc[google.picker.Document.NAME]),
    };
    void openPickedFile(file);
}
async function openPickedFile(file) {
    setPickStatus(`Opening ${file.name}…`);
    try {
        const response = await fetch(buildDriveDownloadUrl(DRIVE_API, file.id), {
            headers: authHeader(),
        });
        if (!response.ok) {
            setPickStatus(`Could not open ${file.name} (HTTP ${response.status}).`);
            return;
        }
        const bytes = await response.arrayBuffer();
        const header = new Uint8Array(bytes, 0, Math.min(8, bytes.byteLength));
        const result = identifyFormat(header);
        if (result.kind === 'invalid') {
            setPickStatus(`${file.name} doesn't look like a KDBX file — no recognized signature found.`);
            return;
        }
        if (!result.implementation) {
            setPickStatus(`${file.name} is ${result.label}, which isn't supported yet.`);
            return;
        }
        showHost(file, bytes, result.implementation);
    }
    catch {
        setPickStatus(`Network error while opening ${file.name}.`);
    }
}
// ============================================================
// Screen: Embedded app (0x67 in an iframe)
// ============================================================
function showHost(file, bytes, implementation) {
    currentFile = file;
    pendingOpen = { filename: file.name, bytes };
    setRoot(cloneTemplate('tpl-host'));
    qs('#host-filename').textContent = file.name;
    qs('[data-action="back-to-drive"]').addEventListener('click', () => {
        requestCloseIframe(tearDownIframe);
    });
    window.addEventListener('message', handleFrameMessage);
    // Setting src last means the iframe's script (and its kw-ready handshake)
    // can't fire before the listener above is attached.
    qs('#app-frame').src = implementation;
}
function tearDownIframe() {
    window.removeEventListener('message', handleFrameMessage);
    currentFile = null;
    pendingOpen = null;
    showChooser();
}
/** Ask the embedded app whether it's safe to remove the iframe — it may have
 * unsaved edits, in which case it shows its own discard-confirmation dialog
 * and only acks if the user agrees. `afterClose` runs once that ack arrives
 * (see handleFrameMessage's isCloseAckMessage branch); if the user cancels,
 * no ack ever comes and nothing happens, exactly like cancelling the same
 * dialog standalone. */
function requestCloseIframe(afterClose) {
    pendingClose = afterClose;
    must(qs('#app-frame').contentWindow).postMessage(closeRequestMessage(), APP_ORIGIN);
}
function handleFrameMessage(event) {
    if (event.origin !== APP_ORIGIN)
        return;
    const iframe = document.getElementById('app-frame');
    if (iframe === null || event.source === null || event.source !== iframe.contentWindow)
        return;
    const source = event.source;
    if (isReadyMessage(event.data)) {
        const open = must(pendingOpen);
        source.postMessage(openMessage(open.filename, open.bytes), APP_ORIGIN);
    }
    else if (isSaveMessage(event.data)) {
        void saveToDrive(event.data.bytes, source);
    }
    else if (isCloseAckMessage(event.data)) {
        const afterClose = pendingClose;
        pendingClose = null;
        afterClose?.();
    }
    else if (isCloseMessage(event.data)) {
        // App-initiated (its own ✕ button) — no request/ack round-trip needed.
        tearDownIframe();
    }
}
async function saveToDrive(bytes, source) {
    const file = must(currentFile);
    try {
        const response = await fetch(buildDriveUpdateUrl(UPLOAD_API, file.id), {
            method: 'PATCH',
            headers: { ...authHeader(), 'Content-Type': 'application/octet-stream' },
            body: bytes,
        });
        if (!response.ok) {
            source.postMessage(savedMessage(false, `HTTP ${response.status}`), APP_ORIGIN);
            return;
        }
        source.postMessage(savedMessage(true), APP_ORIGIN);
    }
    catch {
        source.postMessage(savedMessage(false, 'network error'), APP_ORIGIN);
    }
}
function signOut() {
    accessToken = null;
    currentFile = null;
    pendingOpen = null;
    showSignIn();
}
// ============================================================
// Boot
// ============================================================
showSignIn();

if (typeof buildDriveUpdateUrl !== 'undefined') globalThis.buildDriveUpdateUrl = buildDriveUpdateUrl;
if (typeof isReadyMessage !== 'undefined') globalThis.isReadyMessage = isReadyMessage;
if (typeof isSaveMessage !== 'undefined') globalThis.isSaveMessage = isSaveMessage;
if (typeof isCloseAckMessage !== 'undefined') globalThis.isCloseAckMessage = isCloseAckMessage;
if (typeof isCloseMessage !== 'undefined') globalThis.isCloseMessage = isCloseMessage;
if (typeof openMessage !== 'undefined') globalThis.openMessage = openMessage;
if (typeof savedMessage !== 'undefined') globalThis.savedMessage = savedMessage;
if (typeof closeRequestMessage !== 'undefined') globalThis.closeRequestMessage = closeRequestMessage;
})();
