}

}

}

  color: var(--text);

}

.footer-links a {
  color: var(--accent);
  font-weight: 600;
  text-decoration: none;
}

.footer-links a:hover {
  text-decoration: underline;

  left: 0;

  min-height: 0;
}

}

.app-frame {

  width: 100%;
